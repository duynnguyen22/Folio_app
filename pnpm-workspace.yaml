packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - '@nestjs/cli@12.0.12'
  - '@nestjs/common@12.4.0'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-express@12.4.0'
  - '@nestjs/schematics@12.0.13'
  - '@nestjs/testing@12.4.0'
  - minimatch@11.0.5
